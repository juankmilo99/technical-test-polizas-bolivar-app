spring:
  application:
    name: polizas-app
  autoconfigure:
    # RabbitMQ se activa solo bajo el perfil 'rabbit' (ver application-rabbit.yml).
    # Al excluir su auto-configuración por defecto, la app sigue 100% autocontenida
    # (H2 + eventos in-memory) sin requerir un broker externo.
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  datasource:
    url: jdbc:h2:mem:polizasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

app:
  security:
    api-key-header: x-api-key
    api-key-value: "123456"
  core:
    mock-url: "http://localhost:8080/api/v1/core-mock/event"

logging:
  pattern:
    level: "%5p [corrId=%X{correlationId}]"
  level:
    root: INFO
    com.seguros.polizas: DEBUG
    org.hibernate.SQL: DEBUG

