name: CI - Build, Test & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # 1. Checkout del código
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Configurar JDK 21 (Temurin)
      # ----------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ----------------------------------------------------------
      # 3. Build + Test + Coverage (JaCoCo)
      #    El goal "verify" ejecuta los tests y el report de JaCoCo.
      # ----------------------------------------------------------
      - name: Build, test and generate coverage report
        run: mvn -B clean verify

      # ----------------------------------------------------------
      # 4. Publicar resumen de cobertura en el PR (opcional, usa el
      #    report XML de JaCoCo ubicado en target/site/jacoco)
      # ----------------------------------------------------------
      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      # ----------------------------------------------------------
      # 5. Comentario de cobertura en el PR (solo en pull requests)
      # ----------------------------------------------------------
      - name: Add coverage comment to PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 60
          min-coverage-changed-files: 50

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (sin push, solo validación)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: polizas-app:ci
